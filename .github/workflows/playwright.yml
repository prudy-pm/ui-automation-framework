name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          
      # Allure's HTML report needs to be served over real HTTP
      # -- opening index.html directly from a downloaded zip fails (browsers block the background fetch() calls the report makes from a file:// path). 
      # On GitHub Actions there's no native "embed as a tab" mechanism, so we generate + upload it as a downloadable artifact; viewing it requires
      # `npx allure open <extracted-folder>` (see README).
      # On Azure DevOps, the official `PublishAllureReport@2` task solves this natively by embedding the report as its own pipeline tab -- no download or CLI
      # needed for anyone viewing it.
      
      - name: Generate Allure Report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report
      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
      - name: Notify Teams on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "Playwright CI failed",
            "title": "Playwright tests failed",
            "text": "Repository: ${{ github.repository }} (branch: ${{ github.ref_name }}). View the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"