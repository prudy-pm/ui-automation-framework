# This is a real, verified-working reference for running tests on a pipeline -- changes will need to be
# made for whichever pipeline is actually used. It's a genuine example of wiring Playwright + secrets +
# multi-report artifacts + a failure alert into CI, not a hypothetical.
name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: npx playwright test
      # Allure is generated as ONE self-contained index.html (attachments embedded), so it opens by
      # double-click from a downloaded artifact -- no server or `allure open` needed. It carries no trend graphs;
      # trend lives in the release summary (see README).
      - name: Generate Allure single-file report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --single-file --clean -o allure-report-single
      - name: Generate release summary
        if: ${{ !cancelled() }}
        run: npm run report:summary

      # Every upload below is gated on this: nothing leaves the runner if a secret value appears in any report.
      - name: Scan reports for secrets
        id: secret-scan
        if: ${{ !cancelled() }}
        run: npm run report:scan-secrets

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - name: Upload Allure single-file report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' }}
        with:
          name: allure-report
          path: allure-report-single/
          retention-days: 30
      - name: Upload Monocart report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' }}
        with:
          name: monocart-report
          path: monocart-report/index.zip
          retention-days: 30
      - name: Upload release summary
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.secret-scan.outcome == 'success' }}
        with:
          name: release-summary
          path: release-summary/
          retention-days: 30
      - name: Notify Teams on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "Playwright CI failed",
            "title": "Playwright tests failed",
            "text": "Repository: ${{ github.repository }} (branch: ${{ github.ref_name }}). View the run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }' "${{ secrets.TEAMS_WEBHOOK_URL }}"
